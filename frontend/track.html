<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgriTrace – Histoire de votre produit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="consumer">
  <div class="hero">
    <div class="sub" style="color:var(--lg);font-size:13px">AgriTrace · Vue consommateur</div>
    <h1 id="title">Chargement…</h1>
    <div id="sub" style="margin-bottom:10px"></div>
    <span class="ok" id="proof" style="display:none"></span>
  </div>
  <div class="card">
    <h2>Le parcours de ce produit</h2>
    <p class="hint">De la ferme au magasin : chaque étape a été signée par l'acteur responsable.</p>
    <div id="timeline"></div>
  </div>
  <div class="card">
    <h2>Vérifier un certificat</h2>
    <p class="hint">Choisissez le fichier du certificat : son empreinte est comparée à celle enregistrée sur la blockchain.</p>
    <input type="file" id="vFile">
    <div id="vRes"></div>
  </div>
</div>
<script src="vendor/ethers.umd.min.js"></script>
<script src="common.js"></script>
<script>
(async () => {
  const id = Number(new URLSearchParams(location.search).get("id"));
  const $ = (x) => document.getElementById(x);
  try {
    await AT.init();
    const b = await AT.read.batches(id);
    if (!b.exists) throw new Error("unknown");
    const steps = await AT.read.getHistory(id);
    $("title").textContent = b.product;
    $("sub").textContent = `Lot n° ${b.id} · ${b.quantityKg} kg · Origine : ${b.origin}`;
    $("proof").style.display = "inline-block";
    $("proof").textContent = `Lu sur la blockchain · bloc n° ${await AT.provider.getBlockNumber()} · ${steps.length} étapes`;
    $("timeline").innerHTML = AT.timelineHtml(steps);
    $("vFile").onchange = async () => {
      const f = $("vFile").files[0];
      if (!f) return;
      const r = await AT.verifyFile(f, steps);
      $("vRes").innerHTML = `<div class="res ${r.ok ? "ok" : "bad"}">${AT.esc(r.text)}</div>`;
    };
  } catch (e) {
    $("title").textContent = "Lot introuvable";
    $("sub").textContent = "Aucun lot ne correspond à ce QR code sur la blockchain.";
  }
})();
</script>
</body>
</html>
